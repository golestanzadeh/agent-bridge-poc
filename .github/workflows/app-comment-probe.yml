name: Agent Bridge User Comment Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Post Agent Bridge response as repository owner
        env:
          GH_TOKEN: ${{ secrets.AGENT_BRIDGE_USER_TOKEN }}
        shell: bash
        run: |
          cat > /tmp/user-probe.md <<'EOF'
          [AGENT_BRIDGE]
          protocol_version: 1
          task_id: PR-6-USER-PROBE
          sender: codex
          recipient: work
          status: RESPONSE

          PASS
          Tests: diagnostic only; user-token identity probe. No Codex/API call executed.
          EOF
          gh pr comment 6 --repo golestanzadeh/agent-bridge-poc --body-file /tmp/user-probe.md
